name: Dependency README maintenance

on:
  push:
    branches:
      - feature/7-units-0.2.3-dependency-refresh

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current dependency references
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          replacements = {
              'The current version is **2.2.3**.': 'The current version is **2.2.4**.',
              '- **ESPressio Units >= 0.2.2 < 1.0.0**': '- **ESPressio Units >= 0.2.3 < 1.0.0**',
              'Version 2.2.3 is a dependency-maintenance release. It retains the Timing 2.2.x public API and behaviour while updating the required ESPressio Units baseline to 0.2.2, which in turn carries the optional Serializable 0.10.1 integration. Timing itself remains independent of ESPressio Serializable.': 'Version 2.2.4 is a dependency-maintenance release. It retains the Timing 2.2.x public API and behaviour while updating the required ESPressio Units baseline to 0.2.3, which in turn carries the optional Serializable 0.10.2 integration. Timing itself remains independent of ESPressio Serializable.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected README text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit README update
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'docs: refresh Timing 2.2.4 dependency references (#7)'
          git push
