name: Prepare Timing 2.2.5 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/20-2.2.5-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20-2.2.5-repository-relocation
      - name: Update release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          t = p.read_text()
          t = t.replace('The current version is **2.2.4**.', 'The current version is **2.2.5**.', 1)
          t = t.replace('**ESPressio Units >= 0.2.3 < 1.0.0**', '**ESPressio Units >= 0.2.4 < 1.0.0**', 1)
          t = t.replace('**ESPressio Observable >= 3.0.1 < 4.0.0**', '**ESPressio Observable >= 3.0.2 < 4.0.0**', 1)
          old = 'Version 2.2.4 is a dependency-maintenance release. It retains the Timing 2.2.x public API and behaviour while updating the required ESPressio Units baseline to 0.2.3, which in turn carries the optional Serializable 0.10.2 integration. Timing itself remains independent of ESPressio Serializable.'
          new = 'Version 2.2.5 is the repository-relocation dependency patch. It retains the Timing 2.2.x public API and behaviour while validating against the migrated Units 0.2.4 and Observable 3.0.2 releases. Timing itself remains independent of ESPressio Serializable.'
          t = t.replace(old, new, 1)
          t = t.replace('espressio-development-platform/ESPressio-Timing@^2.2.4', 'espressio-development-platform/ESPressio-Timing@^2.2.5')
          t = t.replace('espressio-development-platform/ESPressio-Units@^0.2.3', 'espressio-development-platform/ESPressio-Units@^0.2.4')
          t = t.replace('espressio-development-platform/ESPressio-Observable@^3.0.1', 'espressio-development-platform/ESPressio-Observable@^3.0.2')
          p.write_text(t)

          p = Path('CHANGELOG.md')
          t = p.read_text()
          entry = '''## 2.2.5 — 2026-08-22\n\n### Changed\n- Published the post-migration ESPressio Timing package generation from the dedicated `ESPressio-Development-Platform` GitHub organization.\n- Raised the required ESPressio Units baseline from 0.2.3 to the migrated 0.2.4 release.\n- Raised the required ESPressio Observable baseline from 3.0.1 to the migrated 3.0.2 release.\n- Updated package metadata, README installation/dependency guidance, CI validation, and current dependency documentation for Timing 2.2.5.\n- Preserved Timing's architecture in which Serializable time representations are supplied through opt-in Serializable Unit types rather than a direct Timing -> Serializable dependency.\n\n### Compatibility\n- No Timing public API or runtime behaviour changes are introduced by this repository-relocation patch release.\n\n'''
          if not t.startswith('# Changelog\n\n## 2.2.5'):
              t = t.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(t)

          p = Path('ESPRESSIO_DEPENDENCY_CHART.md')
          t = p.read_text()
          t = t.replace('Observable    3.0.1', 'Observable    3.0.2', 1)
          t = t.replace('Serializable  0.10.2', 'Serializable  0.10.3', 1)
          t = t.replace('Units         0.2.3', 'Units         0.2.4', 1)
          t = t.replace('Timing        2.2.4', 'Timing        2.2.5', 1)
          t = t.replace('Observable 3.0.1\n    -> none', 'Observable 3.0.2\n    -> none', 1)
          t = t.replace('Serializable 0.10.2\n    -> none', 'Serializable 0.10.3\n    -> none', 1)
          t = t.replace('Units 0.2.3\n    -> none', 'Units 0.2.4\n    -> none', 1)
          t = t.replace('Timing 2.2.4\n    -> Units >= 0.2.3 < 1.0.0\n    -> Observable >= 3.0.1 < 4.0.0', 'Timing 2.2.5\n    -> Units >= 0.2.4 < 1.0.0\n    -> Observable >= 3.0.2 < 4.0.0', 1)
          t = t.replace('Units\n    - - -> Serializable >= 0.10.2 < 1.0.0', 'Units\n    - - -> Serializable >= 0.10.3 < 1.0.0', 1)
          p.write_text(t)

          p = Path('ESPRESSIO_DEPENDENCY_CHART.svg')
          t = p.read_text()
          t = t.replace('Observable 3.0.1', 'Observable 3.0.2', 1)
          t = t.replace('Serializable 0.10.2', 'Serializable 0.10.3', 1)
          t = t.replace('Units 0.2.3', 'Units 0.2.4', 1)
          t = t.replace('Timing 2.2.4', 'Timing 2.2.5', 1)
          p.write_text(t)
          PY
      - name: Validate release documentation
        run: |
          grep -q 'current version is **2.2.5**' README.md
          grep -q 'ESPressio Units >= 0.2.4 < 1.0.0' README.md
          grep -q 'ESPressio Observable >= 3.0.2 < 4.0.0' README.md
          grep -q '^## 2.2.5' CHANGELOG.md
          grep -q 'Timing        2.2.5' ESPRESSIO_DEPENDENCY_CHART.md
      - name: Commit release documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md ESPRESSIO_DEPENDENCY_CHART.md ESPRESSIO_DEPENDENCY_CHART.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Timing 2.2.5 release documentation (#20)'
          git push
