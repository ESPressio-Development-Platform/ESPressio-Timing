name: Dependency Refresh Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'optimisation/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: deps/ESPressio-System
      - name: Configure
        run: cmake -S tests -B build -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/deps/ESPressio-System/src"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/dependencies/ESPressio-Observable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -frtti
          build_unflags =
              -std=gnu++11
              -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../ESPressio-Timing
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_TimingSystemClock.hpp>
          #include <ESPressio_Timing.hpp>

          void setup() {
              auto& clock = ESPressio::Timing::SystemClock<>::GetInstance();
              (void)clock.GetTime();
          }

          void loop() {}
          EOF
      - name: Compile Timing against coordinated abstraction dependencies
        run: pio run -d project/compile

  esp32-serializable-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: optimisation/25-psram-buffers
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create Serializable-time consumer project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -frtti
          build_unflags =
              -std=gnu++11
              -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../ESPressio-Timing
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_TimingSystemClock.hpp>
          #include <ESPressio_Timing.hpp>
          #include <ESPressio_Time_Serializable.hpp>

          using SerializableClockTime =
              ESPressio::Units::SerializableNanoSeconds<uint64_t>;

          void setup() {
              ESPressio::Timing::StopwatchClock<SerializableClockTime> stopwatch;
              SerializableClockTime elapsed = stopwatch.GetTime();
              (void)elapsed;

              auto& systemClock =
                  ESPressio::Timing::SystemClock<SerializableClockTime>::GetInstance();
              SerializableClockTime now = systemClock.GetTime();
              (void)now;
          }

          void loop() {}
          EOF
      - name: Compile Serializable time representation against coordinated abstraction dependencies
        run: pio run -d project/compile
