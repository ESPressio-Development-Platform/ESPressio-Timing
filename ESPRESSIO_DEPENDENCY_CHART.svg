<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.section{font-size:16px;font-weight:700}.node{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:14px;font-weight:600;text-anchor:middle}.small{font-size:11px;text-anchor:middle}.note{font-size:13px}</style>
  <text class="title" x="35" y="42">ESPressio Dependency Architecture — Current Released Generation</text>
  <text class="section" x="35" y="78">Foundation</text>
  <rect class="node" x="55" y="95" width="190" height="58" rx="8"/><text class="label" x="150" y="128">Observable</text>
  <rect class="node" x="300" y="95" width="205" height="58" rx="8"/><text class="label" x="402" y="128">Serializable</text>
  <rect class="node" x="560" y="95" width="180" height="58" rx="8"/><text class="label" x="650" y="128">Units</text>
  <text class="section" x="35" y="205">Runtime / execution</text>
  <rect class="node" x="300" y="225" width="190" height="58" rx="8"/><text class="label" x="395" y="258">Timing</text>
  <rect class="node" x="590" y="225" width="190" height="58" rx="8"/><text class="label" x="685" y="258">Threads</text>
  <text class="section" x="35" y="335">Mechanisms / services</text>
  <rect class="node" x="70" y="355" width="190" height="68" rx="8"/><text class="label" x="165" y="386">Command</text>
  <rect class="node" x="310" y="355" width="190" height="68" rx="8"/><text class="label" x="405" y="386">Security</text>
  <rect class="node" x="550" y="355" width="205" height="68" rx="8"/><text class="label" x="652" y="386">Event</text>
  <rect class="node" x="805" y="355" width="205" height="68" rx="8"/><text class="label" x="907" y="386">Persistence</text>
  <text class="section" x="35" y="485">Transport / connectivity</text>
  <rect class="node" x="100" y="510" width="220" height="72" rx="8"/><text class="label" x="210" y="540">Sockets</text>
  <rect class="node" x="405" y="510" width="220" height="72" rx="8"/><text class="label" x="515" y="540">ESP-Now</text>
  <rect class="node" x="710" y="510" width="230" height="72" rx="8"/><text class="label" x="825" y="540">WiFi</text>
  <text class="section" x="35" y="650">Terminal operator / diagnostics</text>
  <rect class="node" x="435" y="675" width="360" height="92" rx="8"/><text class="label" x="615" y="705">Serial</text><text class="small" x="615" y="728">terminal/downstream</text>
  <text class="section" x="35" y="810">Completed Serializable cascade</text>
  <text class="note" x="55" y="840">Serializable → Units → Timing → Threads → Event → Command / Security</text>
  <text class="note" x="55" y="866">→ Persistence / Sockets / ESP-Now → WiFi → Serial. Tree remains standalone.</text>
</svg>
